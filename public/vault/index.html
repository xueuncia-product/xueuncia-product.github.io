<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>旧时光 · 雪豹 Uncia</title>
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="./gate.css" />
</head>
<body>
  <main class="vault-shell">
    <nav class="vault-topbar" aria-label="页面导航">
      <a href="/">← 回首页</a>
      <div class="vault-actions">
        <div class="vault-theme" aria-label="页面主题"><button type="button" data-theme="sky" aria-pressed="true">☁ 云端</button><button type="button" data-theme="cosmos" aria-pressed="false">☯ 太极</button></div>
        <button type="button" class="vault-lock" hidden>锁定</button>
      </div>
    </nav>
    <header class="vault-heading"><small>UNCIA · ARCHIVE</small><h1>旧时光</h1><p>一些留给自己的文字，慢慢看。</p></header>
    <form class="vault-login">
      <label for="vault-password">访问密码</label>
      <div class="vault-password-row"><input id="vault-password" type="password" autocomplete="off" required maxlength="256" /><button type="submit">解锁</button></div>
      <p class="vault-status" role="status" aria-live="polite"></p>
    </form>
    <section class="vault-library" aria-label="归档目录" hidden>
      <p class="vault-count"></p>
      <div class="vault-views" aria-label="浏览范围"><button type="button" data-scope="featured" aria-pressed="true">精选文章</button><button type="button" data-scope="all" aria-pressed="false">全部记录</button></div>
      <div class="vault-categories" aria-label="内容分类"></div>
      <div class="vault-filters"><label for="vault-year">年份<select id="vault-year"><option value="">全部年份</option></select></label><label for="vault-search">搜索标题<input id="vault-search" type="search" placeholder="找一段旧时光" /></label></div>
      <p class="vault-results" role="status" aria-live="polite"></p>
      <ol class="vault-list"></ol><button class="vault-more" type="button" hidden>再看一些</button>
    </section>
    <section class="vault-reader" aria-label="文章阅读" hidden><button class="vault-back" type="button">← 返回目录</button><h2></h2><p class="vault-meta" role="status" aria-live="polite"></p><iframe sandbox title="归档正文" referrerpolicy="no-referrer"></iframe></section>
    <noscript><p>请开启浏览器 JavaScript 后解锁归档。</p></noscript>
    <footer class="vault-footer">© 2026 雪豹 Uncia</footer>
  </main>
  <script type="module" src="./gate.js"></script>
</body>
</html>
